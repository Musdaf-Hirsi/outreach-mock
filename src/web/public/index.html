<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Outreach — Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /*
    Design concept: "dispatch desk" — the operations console for an outreach
    agency. Cool graphite ground (paper-in-a-ledger, not warm cream) so a
    single warm signal-flag amber accent actually pops instead of competing
    with a warm background. Fraunces (a display serif with real character in
    its heavier weights) carries section titles like a letterhead; IBM Plex
    Sans runs the dense operational text; IBM Plex Mono lines up every
    number/timestamp/id, since this is a tool full of counters and dates.
    Status color is semantic and separate from the amber accent — the accent
    marks "the thing to click," semantic color marks "the thing's state."
  */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f4f6f8;
    --border: #dde2e8;
    --text: #171a1f;
    --text-dim: #5c6570;
    --accent: #b8760f;
    --accent-hover: #9c630c;
    --accent-soft: #faf1de;
    --accent-ink: #171a1f;

    --ok: #157f52;
    --ok-soft: #e6f5ee;
    --warn: #b6540f;
    --warn-soft: #fbeee1;
    --bad: #b83a3a;
    --bad-soft: #fbe9e9;
    --cold: #5c6570;
    --cold-soft: #eceef1;

    --shadow-sm: 0 1px 2px rgba(23, 26, 31, 0.05);
    --shadow-md: 0 6px 20px rgba(23, 26, 31, 0.08), 0 1px 3px rgba(23, 26, 31, 0.05);
    --r-sm: 6px;
    --r-md: 8px;
    --sidebar-w: 248px;

    --display: "Fraunces", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --surface: #1b1f24; --surface-2: #21252b; --border: #2c3138;
      --text: #edf0f3; --text-dim: #939ba6;
      --accent: #d99a3f; --accent-hover: #e8ac57; --accent-soft: #2c2314; --accent-ink: #171a1f;
      --ok: #4ade8c; --ok-soft: #133226;
      --warn: #e8a05e; --warn-soft: #33230f;
      --bad: #f0807f; --bad-soft: #331a1a;
      --cold: #9aa2ab; --cold-soft: #22262c;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171b; --surface: #1b1f24; --surface-2: #21252b; --border: #2c3138;
    --text: #edf0f3; --text-dim: #939ba6;
    --accent: #d99a3f; --accent-hover: #e8ac57; --accent-soft: #2c2314; --accent-ink: #171a1f;
    --ok: #4ade8c; --ok-soft: #133226;
    --warn: #e8a05e; --warn-soft: #33230f;
    --bad: #f0807f; --bad-soft: #331a1a;
    --cold: #9aa2ab; --cold-soft: #22262c;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35); --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  :root[data-theme="light"] {
    --bg: #eef1f4; --surface: #ffffff; --surface-2: #f4f6f8; --border: #dde2e8;
    --text: #171a1f; --text-dim: #5c6570;
    --accent: #b8760f; --accent-hover: #9c630c; --accent-soft: #faf1de; --accent-ink: #171a1f;
    --ok: #157f52; --ok-soft: #e6f5ee;
    --warn: #b6540f; --warn-soft: #fbeee1;
    --bad: #b83a3a; --bad-soft: #fbe9e9;
    --cold: #5c6570; --cold-soft: #eceef1;
    --shadow-sm: 0 1px 2px rgba(23, 26, 31, 0.05); --shadow-md: 0 6px 20px rgba(23, 26, 31, 0.08), 0 1px 3px rgba(23, 26, 31, 0.05);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent-soft); }

  .shell { display: flex; min-height: 100vh; }

  /* --- Sidebar --- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    padding: 1.5rem 1rem; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: baseline; gap: 0.5rem; padding: 0 0.4rem; margin-bottom: 2rem; }
  .brand-mark { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--accent); }
  .brand-name { font-family: var(--display); font-weight: 600; font-size: 1.05rem; letter-spacing: -0.01em; }

  .tabs { display: flex; flex-direction: column; gap: 0.1rem; }
  .tab-btn {
    display: flex; align-items: center; gap: 0.65rem; text-align: left;
    background: none; border: none; border-left: 2px solid transparent; color: var(--text-dim);
    font-family: var(--sans); font-weight: 500; font-size: 0.86rem;
    padding: 0.5rem 0.7rem; cursor: pointer; transition: background 0.12s, color 0.12s, border-color 0.12s;
  }
  .tab-btn svg { width: 16px; height: 16px; flex-shrink: 0; opacity: 0.75; }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 600; }
  .tab-btn.active svg { opacity: 1; }

  .sidebar-footer {
    margin-top: auto; padding: 0.7rem; font-size: 0.7rem; color: var(--text-dim);
    font-family: var(--mono); font-variant-numeric: tabular-nums; border-top: 1px solid var(--border); padding-top: 0.9rem;
  }

  /* --- Main --- */
  .main { flex: 1; min-width: 0; padding: 1.8rem 2.4rem 4rem; max-width: 1180px; }

  .topbar { margin-bottom: 1.6rem; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { color: var(--text-dim); font-size: 0.88rem; margin: 0 0 1.1rem; }

  /* stat strip */
  .stat-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0.7rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 0.8rem 1rem; box-shadow: var(--shadow-sm);
  }
  .stat-label { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; margin-bottom: 0.35rem; }
  .stat-value { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 600; line-height: 1; }
  .stat-value.ok { color: var(--ok); }
  .stat-value.warn { color: var(--warn); }
  .stat-sub { font-size: 0.74rem; color: var(--text-dim); margin-top: 0.3rem; }

  .progress { display: none; } /* superseded by .stat-strip; kept for JS compat, hidden visually */

  .search-row { display: flex; gap: 0.6rem; margin: 1.4rem 0 1rem; }
  input[type="text"], input[type="email"] {
    flex: 1; padding: 0.6rem 0.85rem; border-radius: var(--r-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.88rem; font-family: var(--sans); transition: border-color 0.12s, box-shadow 0.12s;
  }
  input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    padding: 0.55rem 1.05rem; border-radius: var(--r-sm); border: none;
    background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 0.84rem; cursor: pointer;
    transition: background 0.12s, transform 0.05s; box-shadow: var(--shadow-sm); font-family: var(--sans);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  button.secondary:hover:not(:disabled) { background: var(--surface-2); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md);
    padding: 1.1rem 1.3rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm);
  }
  .card.contacted { opacity: 0.55; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .card-title { font-weight: 700; font-size: 0.93rem; }
  .channel-link { color: var(--accent); text-decoration: none; margin-left: 0.3rem; font-weight: 400; }
  .channel-link:hover { text-decoration: underline; }
  .card-meta { color: var(--text-dim); font-size: 0.79rem; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .card-video { color: var(--text-dim); font-size: 0.84rem; margin: 0.4rem 0 0.7rem; }

  .tag { display: inline-block; font-size: 0.68rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 4px; margin-right: 0.4rem; }
  .tag.found { background: var(--accent-soft); color: var(--accent-hover); }
  .tag.contacted { background: var(--cold-soft); color: var(--cold); }

  /* semantic status badges, used by JS for deal status / replied state */
  .status-badge { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.2rem 0.6rem; border-radius: 4px; white-space: nowrap; }
  .status-badge.cold { background: var(--cold-soft); color: var(--cold); }
  .status-badge.replied, .status-badge.negotiating { background: var(--accent-soft); color: var(--accent-hover); }
  .status-badge.closed { background: var(--ok-soft); color: var(--ok); }
  .status-badge.declined { background: var(--bad-soft); color: var(--bad); }
  .status-badge.parked { background: var(--cold-soft); color: var(--cold); }
  .status-badge.yes { background: var(--ok-soft); color: var(--ok); }
  .status-badge.no { background: var(--cold-soft); color: var(--cold); }

  .hints { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.7rem; word-break: break-all; }
  .hints a { color: var(--accent-hover); }

  .card-actions-row { display: flex; gap: 0.5rem; margin: 0 0 1rem; flex-wrap: wrap; }
  .review-note { font-size: 0.78rem; color: var(--accent-hover); margin: 0 0 0.5rem; font-style: italic; }
  .email-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .section-title { font-family: var(--display); font-size: 1.02rem; margin: 0 0 0.7rem; font-weight: 600; }
  .saved-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 0.6rem 0.9rem; margin-bottom: 0.5rem; font-size: 0.88rem;
  }
  .draft-box { margin-top: 0.8rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); padding: 0.9rem 1.1rem; }
  .draft-subject { font-weight: 600; margin-bottom: 0.4rem; font-size: 0.92rem; }
  .draft-body { white-space: pre-wrap; font-size: 0.88rem; color: var(--text-dim); margin-bottom: 0.7rem; line-height: 1.55; }
  .draft-subject[contenteditable="true"], .draft-body[contenteditable="true"] {
    outline: 1px dashed var(--accent); border-radius: 4px; padding: 0.2rem 0.4rem; color: var(--text);
  }
  .actions { display: flex; gap: 0.5rem; }
  .remove-btn { background: var(--bad); color: #fff; }
  .remove-btn:hover:not(:disabled) { background: var(--bad); opacity: 0.85; }

  .status-msg { font-size: 0.83rem; margin-top: 0.5rem; font-weight: 500; }
  .status-msg.ok { color: var(--ok); }
  .status-msg.err { color: var(--bad); }

  .empty { color: var(--text-dim); font-size: 0.88rem; }

  .skipped-box { color: var(--text-dim); font-size: 0.83rem; margin-bottom: 0.7rem; }
  .skipped-box summary { cursor: pointer; font-family: var(--mono); }
  .skipped-box ul { margin: 0.4rem 0 0 1.1rem; padding: 0; max-height: 240px; overflow-y: auto; }
  .skipped-box li { margin-bottom: 0.2rem; }

  .checkbox-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.83rem; color: var(--text-dim); margin: 0.4rem 0 0.6rem; }

  .evaluate-box { margin: 0.6rem 0 1rem; font-size: 0.88rem; }
  .evaluate-box summary { cursor: pointer; color: var(--text-dim); }
  .evaluate-box #evalResult ul { margin: 0.4rem 0 0 1.1rem; padding: 0; }
  .evaluate-box #evalResult li { margin-bottom: 0.2rem; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 0.7rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label { display: block; font-size: 0.74rem; color: var(--text-dim); font-weight: 600; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 0.03em; }
  select, textarea {
    width: 100%; padding: 0.6rem 0.85rem; border-radius: var(--r-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.88rem; font-family: var(--sans); transition: border-color 0.12s, box-shadow 0.12s;
  }
  textarea { resize: vertical; min-height: 3.2rem; }

  table.influencers { width: 100%; border-collapse: collapse; font-size: 0.83rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  table.influencers th, table.influencers td { text-align: left; padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border); }
  table.influencers th { color: var(--text-dim); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; background: var(--surface-2); }
  table.influencers td.num, table.influencers td.date { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  table.influencers tbody tr:hover { background: var(--surface-2); }
  table.influencers tbody tr:last-child td { border-bottom: none; }
  table.influencers select, table.influencers input { width: auto; padding: 0.3rem 0.4rem; font-size: 0.8rem; }
  .row-actions { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }

  .reply-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--warn); border-radius: var(--r-md); padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; box-shadow: var(--shadow-sm); }
  .reply-snippet { font-size: 0.85rem; color: var(--text-dim); margin: 0.3rem 0 0.6rem; font-style: italic; }
  .reply-form { display: none; margin-top: 0.6rem; }
  .reply-form.open { display: block; }

  .followup-card { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--cold); border-radius: var(--r-md); padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; box-shadow: var(--shadow-sm); }

  pre.report-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 0.9rem 1.1rem; font-size: 0.84rem; font-family: var(--mono); white-space: pre-wrap; box-shadow: var(--shadow-sm); font-variant-numeric: tabular-nums; }

  .chat-log { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.8rem; max-height: 58vh; overflow-y: auto; padding: 0.4rem; }
  .chat-msg { max-width: 78%; padding: 0.65rem 0.95rem; border-radius: 12px; font-size: 0.87rem; white-space: pre-wrap; line-height: 1.5; }
  .chat-msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 3px; }
  .chat-msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; box-shadow: var(--shadow-sm); }
  .chat-msg p { margin: 0 0 0.5rem; }
  .chat-msg p:last-child { margin-bottom: 0; }
  .chat-msg ul { margin: 0 0 0.5rem; padding-left: 1.1rem; }
  .chat-msg ul:last-child { margin-bottom: 0; }
  .chat-msg li { margin-bottom: 0.2rem; }
  .chat-msg code { font-family: var(--mono); font-size: 0.85em; background: rgba(127,127,127,0.15); padding: 0.05em 0.35em; border-radius: 4px; }
  .chat-input-row { display: flex; gap: 0.5rem; }
  .chat-input-row textarea { flex: 1; min-height: 2.6rem; }
  .chat-note { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.8rem; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

  @media (max-width: 780px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; overflow-x: auto; }
    .tabs { flex-direction: row; }
    .sidebar-footer { display: none; }
    .main { padding: 1.2rem 1.1rem 3rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <div class="brand-name">Dispatch</div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="youtube">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Find on YouTube
      </button>
      <button class="tab-btn" data-tab="manual">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        Add manually
      </button>
      <button class="tab-btn" data-tab="influencers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Influencers
      </button>
      <button class="tab-btn" data-tab="followups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        Follow-ups
      </button>
      <button class="tab-btn" data-tab="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        Chat with agent
      </button>
    </nav>
    <div class="sidebar-footer">127.0.0.1:4742</div>
  </aside>

  <main class="main">
  <div class="topbar">
    <h1>Influencer outreach</h1>
    <p class="sub">Find real candidates, confirm their real email manually, review the draft, then send.</p>
    <div class="stat-strip" id="statStrip">
      <div class="stat-card"><div class="stat-label">Program day</div><div class="stat-value" id="stat-day">—</div></div>
      <div class="stat-card"><div class="stat-label">Sent this phase</div><div class="stat-value" id="stat-phase">—</div></div>
      <div class="stat-card"><div class="stat-label">Sent today</div><div class="stat-value" id="stat-today">—</div></div>
      <div class="stat-card"><div class="stat-label">Pace</div><div class="stat-value" id="stat-pace">—</div></div>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div id="tab-youtube" class="tab-panel active">
    <div class="search-row">
      <input type="text" id="niche" value="cybersecurity" placeholder='Niche or specific long-tail keyword, e.g. "SOC analyst day in the life"' />
      <button id="searchBtn">Search</button>
      <button id="deepSearchBtn" class="secondary" title="Runs the full course method: long-tail keyword expansion, then intitle: sweep, then copy-a-found-title-and-search-again. Slower and costs more quota than Search.">Deep search</button>
    </div>
    <label class="checkbox-row"><input type="checkbox" id="recentOnly" /> Recent uploads only (last 90 days) — surfaces fresher, smaller channels</label>

    <details class="evaluate-box">
      <summary>Evaluate a channel you already found (paste a URL, @handle, or channel ID)</summary>
      <div class="search-row" style="margin-top:0.6rem">
        <input type="text" id="evalInput" placeholder="https://youtube.com/@handle, or a channel ID" />
        <input type="text" id="evalNiche" placeholder="Niche label (optional)" style="max-width:180px" />
        <button id="evalBtn">Evaluate</button>
      </div>
      <div id="evalResult"></div>
    </details>

    <div id="savedSection" style="display:none">
      <h2 class="section-title">Saved for later</h2>
      <div id="savedList"></div>
    </div>

    <div id="results"></div>
  </div>

  <div id="tab-manual" class="tab-panel">
    <div class="card">
      <div class="form-grid">
        <div>
          <label for="m-platform">Platform</label>
          <select id="m-platform">
            <option value="tiktok">TikTok</option>
            <option value="instagram">Instagram</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>

<script>
const resultsEl = document.getElementById("results");
const searchBtn = document.getElementById("searchBtn");
const deepSearchBtn = document.getElementById("deepSearchBtn");
const nicheInput = document.getElementById("niche");
const progressEl = document.getElementById("progress");

const savedSectionEl = document.getElementById("savedSection");
const savedListEl = document.getElementById("savedList");

function renderSavedList() {
  const saved = JSON.parse(localStorage.getItem("savedCandidates") || "[]");
  if (saved.length === 0) {
    savedSectionEl.style.display = "none";
    return;
  }
  savedSectionEl.style.display = "block";
  savedListEl.innerHTML = "";
  saved.forEach((c) => {
    const row = document.createElement("div");
    row.className = "saved-row";
    row.innerHTML = `
      <span>${c.channelName} <span class="card-meta">(${c.savedNiche})</span></span>
      <button class="secondary remove-saved-btn">Remove</button>
    `;
    row.querySelector(".remove-saved-btn").addEventListener("click", () => {
      const remaining = saved.filter((s) => s.channelId !== c.channelId);
      localStorage.setItem("savedCandidates", JSON.stringify(remaining));
      renderSavedList();
    });
    savedListEl.appendChild(row);
  });
}
renderSavedList();

async function loadProgress() {
  const res = await fetch("/api/progress");
  const p = await res.json();
  document.getElementById("stat-day").textContent = p.programDay;
  document.getElementById("stat-phase").textContent = `${p.phaseProgress}/${p.phaseTarget}`;
  document.getElementById("stat-today").textContent = p.outreachesToday;
  const paceEl = document.getElementById("stat-pace");
  paceEl.textContent = p.onTrack ? "On track" : "Behind";
  paceEl.className = "stat-value " + (p.onTrack ? "ok" : "warn");
}
loadProgress();

// Maps a deal status / yes-no value to a semantic status-badge span —
// used by the Influencers table so state reads as a color/shape at a
// glance, not just a word buried in a row of text.
function statusBadge(value) {
  const key = String(value).toLowerCase();
  return `<span class="status-badge ${key}">${value}</span>`;
}

// Shared by both the YouTube and manual-add flows. Renders a draft with
// Edit/Send/Discard actions into `container`. Editing makes the subject/body
// directly editable in place; sending always re-signs a fresh approval token
// against whatever's currently in those fields right before sending (via
// /api/approve-edit), so an edited draft sends the edited text, not the
// original — and a not-yet-approved draft becomes sendable once the human
// has edited it, same as the CLI's "edit to fix the issue" flow.
function renderDraftBox(container, draft, sendInfo) {
  container.innerHTML = `
    <div class="draft-box">
      ${draft.reviewNote ? `<p class="review-note">${draft.reviewNote}</p>` : ""}
      <div class="draft-subject">${draft.subject}</div>
      <div class="draft-body">${draft.body}</div>
      <div class="actions">
        <button class="secondary edit-btn">Edit</button>
        <button class="send-btn" ${draft.approved ? "" : "disabled"}>Send to ${sendInfo.to}</button>
        <button class="secondary discard-btn">Discard</button>
      </div>
      <div class="status-msg"></div>
    </div>
  `;

  const box = container.querySelector(".draft-box");
  const subjectEl = box.querySelector(".draft-subject");
  const bodyEl = box.querySelector(".draft-body");
  const editBtn = box.querySelector(".edit-btn");
  const sendBtn = box.querySelector(".send-btn");
  const discardBtn = box.querySelector(".discard-btn");
  const statusMsg = box.querySelector(".status-msg");

  if (!draft.approved) {
    statusMsg.textContent = "Not approved by supervisor — edit to fix the issue, then send, or discard and re-draft.";
    statusMsg.className = "status-msg err";
  }

  editBtn.addEventListener("click", () => {
    subjectEl.contentEditable = "true";
    bodyEl.contentEditable = "true";
    subjectEl.focus();
    sendBtn.disabled = false;
    editBtn.disabled = true;
    editBtn.textContent = "Editing…";
    if (!draft.approved) {
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
    }
  });

  sendBtn.addEventListener("click", async () => {
    const subject = subjectEl.textContent.trim();
    const body = bodyEl.textContent.trim();
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    try {
      const approveRes = await fetch("/api/approve-edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to: sendInfo.to, subject, body }),
      });
      const approval = await approveRes.json();
      if (approval.error) throw new Error(approval.error);

      const sendRes = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          to: sendInfo.to,
          subject,
          body,
          channelName: sendInfo.channelName,
          niche: sendInfo.niche,
          platform: sendInfo.platform,
          approvalToken: approval.approvalToken,
        }),
      });
      const sendResult = await sendRes.json();
      if (sendResult.error) throw new Error(sendResult.error);
      statusMsg.textContent = "Sent!";
      statusMsg.className = "status-msg ok";
      sendBtn.remove();
      discardBtn.remove();
      editBtn.remove();
      loadProgress();
    } catch (err) {
      statusMsg.textContent = "Failed: " + err.message;
      statusMsg.className = "status-msg err";
      sendBtn.disabled = false;
      sendBtn.textContent = "Retry send";
    }
  });

  discardBtn.addEventListener("click", () => {
    container.innerHTML = "";
  });
}

function candidateCard(c, niche) {
  const div = document.createElement("div");
  div.className = "card" + (c.alreadyContacted ? " contacted" : "");

  const hints = [];
  if (c.contactHints.emails.length) hints.push(`Email(s) found: ${c.contactHints.emails.join(", ")}`);
  if (c.contactHints.links.length) hints.push(`Links: ${c.contactHints.links.slice(0, 3).join(", ")}`);

  const channelUrl = `https://www.youtube.com/channel/${c.channelId}`;
  const aboutUrl = `${channelUrl}/about`;

  div.innerHTML = `
    <div class="card-head">
      <span class="card-title">
        ${c.channelName}
        <a href="${channelUrl}" target="_blank" rel="noopener" class="channel-link" title="Open channel">↗</a>
      </span>
      <span class="card-meta">${c.subscribers.toLocaleString()} subs · ${(c.engagementRate * 100).toFixed(2)}% engagement · ${c.avgViews.toLocaleString()} avg views</span>
    </div>
    <p class="card-video">Latest: "${c.recentVideoTopic}"</p>
    <p class="hints"><a href="${aboutUrl}" target="_blank" rel="noopener">Open About page to find their email →</a></p>
    ${c.alreadyContacted ? `<span class="tag contacted">Already contacted ${c.lastContactedAt ? "on " + new Date(c.lastContactedAt).toLocaleDateString() : ""}</span>` : ""}
    ${hints.length ? `<p class="hints">${hints.join("<br/>")}</p>` : `<p class="hints">No email or links found in public descriptions.</p>`}
    ${!c.alreadyContacted ? `
      <div class="card-actions-row">
        <button class="secondary save-btn">Save for later</button>
        <button class="secondary skip-btn">Skip →</button>
      </div>
      <div class="email-row">
        <input type="email" placeholder="Real email you found manually" class="email-input" />
        <button class="draft-btn">Draft</button>
      </div>
      <div class="draft-container"></div>
    ` : ""}
  `;

  if (!c.alreadyContacted) {
    const emailInput = div.querySelector(".email-input");
    const draftBtn = div.querySelector(".draft-btn");
    const draftContainer = div.querySelector(".draft-container");
    const saveBtn = div.querySelector(".save-btn");
    const skipBtn = div.querySelector(".skip-btn");

    skipBtn.addEventListener("click", () => {
      div.remove();
    });

    saveBtn.addEventListener("click", () => {
      const saved = JSON.parse(localStorage.getItem("savedCandidates") || "[]");
      if (!saved.some((s) => s.channelId === c.channelId)) {
        saved.push({ ...c, savedNiche: niche, savedAt: new Date().toISOString() });
        localStorage.setItem("savedCandidates", JSON.stringify(saved));
      }
      saveBtn.textContent = "Saved ✓";
      saveBtn.disabled = true;
      renderSavedList();
    });

    draftBtn.addEventListener("click", async () => {
      if (!emailInput.value.trim()) {
        alert("Enter the real email first.");
        return;
      }
      draftBtn.disabled = true;
      draftBtn.textContent = "Drafting…";
      try {
        const res = await fetch("/api/draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            channelName: c.channelName,
            niche,
            recentVideoTopic: c.recentVideoTopic,
            to: emailInput.value.trim(),
          }),
        });
        const draft = await res.json();
        if (draft.error) throw new Error(draft.error);

        renderDraftBox(draftContainer, draft, {
          to: emailInput.value.trim(),
          channelName: c.channelName,
          niche,
          platform: "youtube",
        });
      } catch (err) {
        alert("Draft failed: " + err.message);
      } finally {
        draftBtn.disabled = false;
        draftBtn.textContent = "Draft";
      }
    });
  }

  return div;
}

async function runNicheSearch(url, niche, btn, busyLabel, idleLabel, pollProgress) {
  btn.disabled = true;
  btn.textContent = busyLabel;
  resultsEl.innerHTML = "";

  let progressInterval;
  if (pollProgress) {
    progressInterval = setInterval(async () => {
      try {
        const p = await (await fetch("/api/find-deep-progress")).json();
        if (p.phase === "keywords" || p.phase === "title-echo") {
          const phaseLabel = p.phase === "keywords" ? "long-tail keywords" : "title-echo searches";
          btn.textContent = `${phaseLabel} ${p.completed}/${p.total} · ${p.candidatesSoFar} candidate(s) so far`;
        }
      } catch {
        // Progress polling failing is not worth interrupting the actual search over.
      }
    }, 1500);
  }

  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    const skipped = data.skipped ?? [];
    const evaluatedCount = data.results.length + skipped.length;
    let metaHtml = "";
    if (skipped.length > 0) {
      const reasonCounts = new Map();
      for (const s of skipped) {
        const key = s.reason.split(" — ")[0].split(",")[0];
        reasonCounts.set(key, (reasonCounts.get(key) ?? 0) + 1);
      }
      const breakdown = [...reasonCounts.entries()].map(([reason, n]) => `${n} ${reason}`).join(" · ");
      const rows = skipped
        .map((s) => `<li>${s.channelName} (${s.subscribers.toLocaleString()} subs) — ${s.reason}</li>`)
        .join("");
      metaHtml = `
        <details class="skipped-box">
          <summary>${evaluatedCount} evaluated · ${data.results.length} passed · ${breakdown}</summary>
          <ul>${rows}</ul>
        </details>`;
    } else if (evaluatedCount > 0) {
      metaHtml = `<p class="card-meta">${evaluatedCount} evaluated · ${data.results.length} passed</p>`;
    }
    if (data.searchedKeywords) {
      metaHtml += `<p class="card-meta">Searched ${data.searchedKeywords.length} long-tail keyword(s)${data.titleEchoSearches?.length ? ` + ${data.titleEchoSearches.length} title-echo search(es)` : ""}${data.failedKeywords?.length ? ` — ${data.failedKeywords.length} failed` : ""}</p>`;
    }
    // These are channels skipped BEFORE evaluation (already on the sheet,
    // or rejected within the last 7 days) — without this line, a repeat
    // search of an already-swept niche shows "0 evaluated, 0 skipped" and
    // reads as an empty niche when it's actually already fully handled.
    if (data.skippedAlreadyFound || data.skippedRecentlyRejected) {
      const parts = [];
      if (data.skippedAlreadyFound) parts.push(`${data.skippedAlreadyFound} already on your sheet`);
      if (data.skippedRecentlyRejected) parts.push(`${data.skippedRecentlyRejected} rejected within the last 7 days`);
      metaHtml += `<p class="card-meta">Also skipped before evaluation: ${parts.join(" · ")}</p>`;
    }

    if (data.results.length === 0) {
      resultsEl.innerHTML = `<p class="empty">No candidates passed the filters for "${niche}".</p>${metaHtml}`;
    } else {
      resultsEl.innerHTML = metaHtml;
      for (const c of data.results) {
        resultsEl.appendChild(candidateCard(c, niche));
      }
    }
  } catch (err) {
    resultsEl.innerHTML = `<p class="empty">Search failed: ${err.message}</p>`;
  } finally {
    if (progressInterval) clearInterval(progressInterval);
    btn.disabled = false;
    btn.textContent = idleLabel;
  }
}

searchBtn.addEventListener("click", () => {
  const niche = nicheInput.value.trim();
  if (!niche) return;
  const recentOnly = document.getElementById("recentOnly").checked;

deepSearchBtn.addEventListener("click", () => {

  runNicheSearch(`/api/find-deep?niche=${encodeURIComponent(niche)}`, niche, deepSearchBtn, "Starting full sweep…", "Deep search", true);
});

// --- Evaluate a pasted channel ------------------------------------------
const evalInput = document.getElementById("evalInput");
const evalNicheInput = document.getElementById("evalNiche");
const evalBtn = document.getElementById("evalBtn");
const evalResultEl = document.getElementById("evalResult");

async function runEvaluate() {
  const channelInput = evalInput.value.trim();
  if (!channelInput) return;

  evalBtn.disabled = true;
  evalBtn.textContent = "Evaluating…";
  evalResultEl.innerHTML = "";

  try {
    const res = await fetch("/api/evaluate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ channelInput, niche: evalNicheInput.value.trim() || undefined }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    if (!data.found) {
      evalResultEl.innerHTML = `<p class="empty">${data.error ?? "Channel not found."}</p>`;
      return;
    }

    const verdictClass = data.passed ? "ok" : "err";
    const reasonsHtml = (data.reasons ?? []).map((r) => `<li>${r}</li>`).join("");
    evalResultEl.innerHTML = `
      <div class="draft-box">
        <p class="card-meta">
          <a href="${data.channelUrl}" target="_blank" rel="noopener">${data.channelName}</a>
          — ${data.subscribers?.toLocaleString() ?? "?"} subs, ~${data.avgViews?.toLocaleString() ?? "?"} avg views,
          ${data.engagementRate !== undefined ? (data.engagementRate * 100).toFixed(2) + "%" : "?"} engagement
          ${data.alreadyContacted ? " · already contacted" : ""}
        </p>
        <p class="status-msg ${verdictClass}">${data.passed ? "PASSED — qualifies under current filters" : "DID NOT PASS"}</p>
        <ul>${reasonsHtml}</ul>
      </div>`;
    if (data.passed) loadInfluencers();
  } catch (err) {
    evalResultEl.innerHTML = `<p class="empty">Evaluate failed: ${err.message}</p>`;
  } finally {
    evalBtn.disabled = false;
    evalBtn.textContent = "Evaluate";
  }
}

evalBtn.addEventListener("click", runEvaluate);
evalInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") runEvaluate();
});

const mPlatform = document.getElementById("m-platform");
const mName = document.getElementById("m-name");
const mLink = document.getElementById("m-link");

const mFollowers = document.getElementById("m-followers");
const mContent = document.getElementById("m-content");

const mEmail = document.getElementById("m-email");

const mHistory = document.getElementById("m-history");
const mDraftContainer = document.getElementById("m-draftContainer");

let lastCheckedEmail = "";
mEmail.addEventListener("blur", async () => {
  const email = mEmail.value.trim();
  if (!email || email === lastCheckedEmail) return;
  lastCheckedEmail = email;
  try {
    const res = await fetch(`/api/manual/contact-history?email=${encodeURIComponent(email)}`);
    const history = await res.json();
    mHistory.textContent = history.contacted
      ? `Already contacted ${history.timesContacted}x, last on ${new Date(history.lastContactedAt).toLocaleDateString()} — you can still send if you mean to.`
      : "";
  } catch {
    mHistory.textContent = "";
  }
});

mDraftBtn.addEventListener("click", async () => {
  const displayName = mName.value.trim();
  const niche = mNiche.value.trim();
  const email = mEmail.value.trim();
  if (!displayName || !niche) {
    alert("Creator name and niche are required.");
    return;
  }
  if (!email) {
    alert("Enter the real email first.");
    return;
  }

  const link = mLink.value.trim();
  const fullName = link ? `${displayName} (${link})` : displayName;
  const allowedBrands = mBrands.value.trim()
    ? mBrands.value.split(",").map((b) => b.trim()).filter(Boolean)
    : [];
  const platform = mPlatform.value;

  mDraftBtn.disabled = true;
  mDraftBtn.textContent = "Drafting…";
  try {
    const res = await fetch("/api/manual/draft", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        displayName: fullName,
        niche,
        contentDescription: mContent.value.trim(),
        allowedBrands,
        to: email,
      }),
    });
    const draft = await res.json();
    if (draft.error) throw new Error(draft.error);

    renderDraftBox(mDraftContainer, draft, {
      to: email,
      channelName: fullName,
      niche,
      platform,
    });
  } catch (err) {
    alert("Draft failed: " + err.message);
  } finally {
    mDraftBtn.disabled = false;
    mDraftBtn.textContent = "Draft";
  }
});

// --- Influencers list -----------------------------------------------------
const infTable = document.getElementById("inf-table");
const infRefreshBtn = document.getElementById("inf-refreshBtn");

const PLATFORM_LABEL = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", other: "Other" };

async function loadInfluencers() {
  infTable.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    const res = await fetch("/api/influencers");
    const data = await res.json();
    const creators = data.creators || [];
    if (creators.length === 0) {
      infTable.innerHTML = `<p class="empty">No real outreach sent yet.</p>`;
      return;
    }
    infTable.innerHTML = `
      <table class="influencers">
        <thead>
          <tr><th>Creator</th><th>Platform</th><th>Niche</th><th>Status</th><th>Replied</th><th>Times</th><th>Last contacted</th><th>Rate</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    `;
    const tbody = infTable.querySelector("tbody");
    for (const c of creators) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.channelName}</td>
        <td>${PLATFORM_LABEL[c.platform] || c.platform}</td>
        <td>${c.niche}</td>
        <td>${statusBadge(c.dealStatus)}</td>
        <td>${statusBadge(c.replied ? "yes" : "no")}</td>
        <td class="num">${c.timesContacted}</td>
        <td class="date">${new Date(c.lastContactedAt).toLocaleDateString()}</td>
        <td>
          <select class="rate-select">
            <option value="">-</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option>
          </select>
        </td>
        <td class="row-actions">
          <button class="secondary draft-reply-btn">Draft reply</button>
          ${!c.replied ? `<button class="secondary mark-replied-btn">Mark replied</button>` : ""}
          <button class="secondary remove-btn">Remove</button>
        </td>
      `;
      const replyRow = document.createElement("tr");
      const replyCell = document.createElement("td");
      replyCell.colSpan = 9;
      replyRow.appendChild(replyCell);
      replyRow.style.display = "none";

      // Persistent version of the reply/negotiate card (see negotiateCard's
      // comment) — not tied to a single "Check for replies" run, so you can
      // come back and respond to someone whenever, not just the moment a
      // reply was first detected.
      tr.querySelector(".draft-reply-btn").addEventListener("click", () => {
        if (replyCell.childElementCount === 0) {
          replyCell.appendChild(negotiateCard(c.channelId, c.channelName, "", true));
        }
        replyRow.style.display = replyRow.style.display === "none" ? "" : "none";
      });

      // Closes over the real channelId (rather than embedding it in HTML),
      // so anything unusual in it — an email with a "+", etc. — can't break
      // attribute escaping the way string-interpolating it into markup could.
      tr.querySelector(".remove-btn").addEventListener("click", async () => {
        if (!confirm(`Remove ${c.channelName} from the influencers list? This deletes their outreach history.`)) return;
        try {
          const res = await fetch(`/api/influencers/${encodeURIComponent(c.channelId)}`, { method: "DELETE" });
          const result = await res.json();
          if (result.error) throw new Error(result.error);
          tr.remove();
        } catch (err) {
          alert("Remove failed: " + err.message);
        }
      });

      const markRepliedBtn = tr.querySelector(".mark-replied-btn");
      if (markRepliedBtn) {
        markRepliedBtn.addEventListener("click", async () => {
          try {
            await fetch(`/api/mark-replied/${encodeURIComponent(c.channelId)}`, { method: "POST" });
            loadInfluencers();
          } catch (err) {
            alert("Failed: " + err.message);
          }
        });
      }

      tr.querySelector(".rate-select").addEventListener("change", async (e) => {
        const rating = e.target.value;
        if (!rating) return;
        const note = prompt(`Note for this ${rating}/5 rating (optional):`) || undefined;
        try {
          await fetch("/api/rate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channelId: c.channelId, channelName: c.channelName, rating: Number(rating), note }),
          });
        } catch (err) {
          alert("Rate failed: " + err.message);
        }
      });

      tbody.appendChild(tr);
      tbody.appendChild(replyRow);
    }
  } catch (err) {
    infTable.innerHTML = `<p class="empty">Failed to load: ${err.message}</p>`;
  }
}

// Draft-a-reply / negotiate card. Used two ways: (1) right after "Check for
// replies" detects something new, pre-filled with the snippet and already
// open, and (2) as a persistent "Draft reply" button on any Influencers row
// — a reply only shows up in (1) for the one run that detected it (it won't
// be re-detected once marked replied), so without (2) there'd be no way to
// come back later and actually respond to someone who already replied.
// initialMessage is editable either way, since a persistent open from the
// table has no snippet to start from — you paste in whatever they said.
function negotiateCard(channelId, channelName, initialMessage, autoOpen) {
  const div = document.createElement("div");
  div.className = "reply-card";
  div.innerHTML = `
    <div class="card-title">${channelName}</div>
    <button class="secondary open-reply-btn">Reply / Negotiate</button>
    <div class="reply-form">
      <div class="form-grid">
        <div class="full">
          <label>What did they say? (edit/paste as needed)</label>
          <textarea class="r-message">${initialMessage || ""}</textarea>
        </div>
        <div>
          <label>Their quoted price (optional)</label>
          <input type="text" class="r-price" placeholder="e.g. 500" />
        </div>
        <div>
          <label>Engagement rate, decimal (optional)</label>
          <input type="text" class="r-engagement" placeholder="e.g. 0.04" />
        </div>
        <div class="full">
          <label>Recent video view counts, comma-separated (optional, for CPM baseline)</label>
          <input type="text" class="r-views" placeholder="120000, 95000, 140000" />
        </div>
        <div class="full">
          <label>Audience note from their media kit (optional — top countries, age split, gender split — used as real negotiating leverage, not just info)</label>
          <textarea class="r-audienceNote" placeholder="e.g. 65% US, 20% UK, mostly 25-34, 70% male"></textarea>
          <button class="secondary r-saveAudienceBtn" type="button">Save note</button>
          <span class="r-audienceStatus status-msg"></span>
        </div>
      </div>
      <button class="r-draftBtn">Draft reply</button>
      <div class="r-draftContainer"></div>
    </div>
  `;

  const openBtn = div.querySelector(".open-reply-btn");
  const form = div.querySelector(".reply-form");
  if (autoOpen) form.classList.add("open");
  openBtn.addEventListener("click", () => {
    form.classList.toggle("open");
  });

  const audienceNoteEl = div.querySelector(".r-audienceNote");
  const audienceStatusEl = div.querySelector(".r-audienceStatus");
  fetch(`/api/negotiate/context/${encodeURIComponent(channelId)}`)
    .then((r) => r.json())
    .then((context) => {
      if (context.state?.audienceNote) audienceNoteEl.value = context.state.audienceNote;
    })
    .catch(() => {});

  async function saveAudienceNote() {
    const audienceNote = audienceNoteEl.value.trim();
    try {
      await fetch("/api/negotiate/audience-note", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channelId, channelName, audienceNote }),
      });
      audienceStatusEl.textContent = "Saved.";
      audienceStatusEl.className = "r-audienceStatus status-msg ok";
    } catch (err) {
      audienceStatusEl.textContent = "Failed to save: " + err.message;
      audienceStatusEl.className = "r-audienceStatus status-msg err";
    }
  }
  div.querySelector(".r-saveAudienceBtn").addEventListener("click", saveAudienceNote);

  // No message handed in up front (the persistent per-row "Draft reply"
  // case, as opposed to right after "Check for replies" detects one) — pull
  // their actual latest reply straight from Gmail instead of making the
  // human paste it in by hand. It's already been read once via
  // check-replies; there's no reason to ask again.
  if (!initialMessage) {
    const messageEl = div.querySelector(".r-message");
    messageEl.placeholder = "Loading their message from Gmail…";
    messageEl.disabled = true;
    fetch(`/api/negotiate/last-message/${encodeURIComponent(channelId)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) throw new Error(data.error);
        messageEl.value = data.message?.body ?? "";
        messageEl.placeholder = data.message ? "" : "Couldn't auto-fetch a reply — paste it in manually.";
      })
      .catch((err) => {
        messageEl.placeholder = "Couldn't auto-fetch (" + err.message + ") — paste it in manually.";
      })
      .finally(() => {
        messageEl.disabled = false;
      });
  }

  div.querySelector(".r-draftBtn").addEventListener("click", async () => {
    const draftBtn = div.querySelector(".r-draftBtn");
    const draftContainer = div.querySelector(".r-draftContainer");
    const creatorMessage = div.querySelector(".r-message").value.trim();
    const priceRaw = div.querySelector(".r-price").value.trim();
    const engagementRaw = div.querySelector(".r-engagement").value.trim();
    const viewsRaw = div.querySelector(".r-views").value.trim();
    const viewCounts = viewsRaw ? viewsRaw.split(",").map((s) => Number(s.trim())).filter((n) => !Number.isNaN(n)) : [];

    if (!creatorMessage) {
      alert("Enter what they said first.");
      return;
    }

    draftBtn.disabled = true;
    draftBtn.textContent = "Drafting…";
    try {
      // Persist the audience note first — the negotiation agent reads it
      // from saved state (getNegotiationState), not from this request body,
      // so a note typed but never explicitly saved would otherwise be
      // silently invisible to the draft that's about to be generated.
      await saveAudienceNote();
      const contextRes = await fetch(`/api/negotiate/context/${encodeURIComponent(channelId)}`);
      const context = await contextRes.json();
      const to = context.lastSend?.to;
      if (!to) throw new Error("No prior send on file for this channel — can't determine recipient.");

      const res = await fetch("/api/negotiate/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          channelId,
          channelName,
          niche: context.lastSend?.niche,
          creatorMessage,
          quotedPrice: priceRaw || undefined,
          engagementRate: engagementRaw || undefined,
          viewCounts,
        }),
      });
      const draft = await res.json();
      if (draft.error) throw new Error(draft.error);

      draftContainer.innerHTML = `
        <div class="draft-box">
          ${draft.reviewNote ? `<p class="review-note">${draft.reviewNote}</p>` : ""}
          ${draft.roundWarning ? `<p class="review-note">${draft.roundWarning}</p>` : ""}
          <p class="card-meta">Recommended action: ${draft.action}${draft.evaluation ? ` — CPM verdict: ${draft.evaluation.verdict}` : ""}</p>
          <div class="draft-body">${draft.body}</div>
          ${
            draft.action === "accept"
              ? `<div class="deal-structure">
                  <label>Deal type
                    <select class="r-dealType">
                      <option value="flat">Flat</option>
                      <option value="cpm">CPM</option>
                      <option value="hybrid">Hybrid</option>
                    </select>
                  </label>
                  <span class="r-cpmFields" style="display:none">
                    <label>CPM rate ($/1000 views) <input class="r-cpmRate" type="number" min="0" step="0.01" /></label>
                    <label>View cap <input class="r-viewCap" type="number" min="0" /></label>
                    <label>Monitoring days <input class="r-monitoringDays" type="number" min="1" value="30" /></label>
                  </span>
                </div>`
              : ""
          }
          <div class="actions">
            <button class="secondary r-editBtn">Edit</button>
            <button class="r-sendBtn" ${draft.approved ? "" : "disabled"}>Send to ${to}</button>
            <button class="secondary r-discardBtn">Discard</button>
          </div>
          <div class="status-msg"></div>
        </div>
      `;

      const dealTypeSel = draftContainer.querySelector(".r-dealType");
      const cpmFields = draftContainer.querySelector(".r-cpmFields");
      dealTypeSel?.addEventListener("change", () => {
        cpmFields.style.display = dealTypeSel.value === "flat" ? "none" : "";
      });

      const bodyEl = draftContainer.querySelector(".draft-body");
      const editBtn = draftContainer.querySelector(".r-editBtn");
      const sendBtn = draftContainer.querySelector(".r-sendBtn");
      const discardBtn = draftContainer.querySelector(".r-discardBtn");
      const statusMsg = draftContainer.querySelector(".status-msg");

      if (!draft.approved) {
        statusMsg.textContent = "Not approved by supervisor — edit to fix the issue, then send.";
        statusMsg.className = "status-msg err";
      }

      editBtn.addEventListener("click", () => {
        bodyEl.contentEditable = "true";
        bodyEl.focus();
        sendBtn.disabled = false;
        editBtn.disabled = true;
        editBtn.textContent = "Editing…";
      });

      sendBtn.addEventListener("click", async () => {
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        try {
          const dealType = dealTypeSel?.value;
          const sendRes = await fetch("/api/negotiate/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              channelId,
              channelName,
              niche: context.lastSend?.niche,
              to,
              body: bodyEl.textContent.trim(),
              quotedPrice: priceRaw || undefined,
              action: draft.action,
              gmailThreadId: context.lastSend?.gmailThreadId,
              rfcMessageId: context.lastSend?.rfcMessageId,
              dealType,
              cpmRate: dealType && dealType !== "flat" ? draftContainer.querySelector(".r-cpmRate")?.value || undefined : undefined,
              viewCap: dealType && dealType !== "flat" ? draftContainer.querySelector(".r-viewCap")?.value || undefined : undefined,
              monitoringDays:
                dealType && dealType !== "flat" ? draftContainer.querySelector(".r-monitoringDays")?.value || undefined : undefined,
            }),
          });
          const sendResult = await sendRes.json();
          if (sendResult.error) throw new Error(sendResult.error);
          statusMsg.textContent = `Sent! Deal status: ${sendResult.dealStatus ?? "n/a"}.`;
          if (sendResult.closeWarnings?.length) {
            statusMsg.textContent += ` Closed with gaps: ${sendResult.closeWarnings.join(", ")} — worth filling in before this reaches the brand phase.`;
          }
          statusMsg.className = "status-msg ok";
          sendBtn.remove();
          discardBtn.remove();
          editBtn.remove();
          loadInfluencers();
        } catch (err) {
          statusMsg.textContent = "Failed: " + err.message;
          statusMsg.className = "status-msg err";
          sendBtn.disabled = false;
          sendBtn.textContent = "Retry send";
        }
      });

      discardBtn.addEventListener("click", () => {
        draftContainer.innerHTML = "";
      });
    } catch (err) {
      alert("Draft failed: " + err.message);
    } finally {
      draftBtn.disabled = false;
      draftBtn.textContent = "Draft reply";
    }
  });

  return div;
}

async function loadFollowups() {

    const res = await fetch("/api/followups");

    fuSummary.textContent = `Due now: ${data.due.length} | Not yet due: ${data.notYetDue.length} | Needs new thread (max follow-ups reached): ${data.needsNewThread.length}`;
    fuList.innerHTML = "";
    if (data.due.length === 0) {
      fuList.innerHTML = `<p class="empty">Nothing due right now.</p>`;
      return;

    for (const c of data.due) {

      fuList.appendChild(followupCard(c));
    }
  } catch (err) {
    fuList.innerHTML = `<p class="empty">Failed to load: ${err.message}</p>`;
  }
}

// Keyed by agent id so switching agents (or tabs) doesn't lose each
// conversation's history — history lives only in this tab, not on the server.
const chatHistories = {};
let chatAgentsLoaded = false;

async function loadChatAgents() {

    renderChatLog();
  } catch (err) {

}

  chatNote.textContent = chatAgentSelect.selectedOptions[0]?.dataset.note ?? "";
}

chatAgentSelect.addEventListener("change", () => {

});

function currentHistory() {
  const id = chatAgentSelect.value;
  if (!chatHistories[id]) chatHistories[id] = [];
  return chatHistories[id];
}

// Agent replies are written in markdown (bold, bullet lists) — a plain
// textContent render just showed the raw ** and - characters instead of
// formatting them, which is why the chat looked so much rougher than a
// normal chat UI. This handles the small subset agents actually produce
// (bold, inline code, bullet lists, paragraph breaks); escapes HTML first
// since message content ultimately comes from an LLM and shouldn't be
// trusted as markup.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inlineMarkdown(s) {
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderMarkdownLite(text) {
  const lines = escapeHtml(text).split("\n");
  let html = "";
  let inList = false;
  for (const line of lines) {
    const bulletMatch = line.match(/^\s*[-*]\s+(.*)/);
    if (bulletMatch) {
      if (!inList) { html += "<ul>"; inList = true; }
      html += `<li>${inlineMarkdown(bulletMatch[1])}</li>`;
      continue;
    }
    if (inList) { html += "</ul>"; inList = false; }
    html += line.trim() === "" ? "<br/>" : `<p>${inlineMarkdown(line)}</p>`;
  }
  if (inList) html += "</ul>";
  return html;
}

function renderChatLog() {
  const history = currentHistory();
  chatLog.innerHTML = "";
  for (const msg of history) {
    const div = document.createElement("div");
    div.className = "chat-msg " + msg.role;
    div.innerHTML = renderMarkdownLite(msg.content);
    chatLog.appendChild(div);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  const agentId = chatAgentSelect.value;
  const history = currentHistory();
  history.push({ role: "user", content: text });
  chatInput.value = "";
  renderChatLog();

  chatSendBtn.disabled = true;
  chatSendBtn.textContent = "…";
  try {
    const res = await fetch(`/api/chat/${encodeURIComponent(agentId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    history.push({ role: "assistant", content: data.reply });
    renderChatLog();
  } catch (err) {
    history.push({ role: "assistant", content: "(error: " + err.message + ")" });
    renderChatLog();
  } finally {
    chatSendBtn.disabled = false;
    chatSendBtn.textContent = "Send";
  }
}

chatSendBtn.addEventListener("click", sendChatMessage);
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
chatClearBtn.addEventListener("click", () => {
  chatHistories[chatAgentSelect.value] = [];
  renderChatLog();
});

document.querySelector('.tab-btn[data-tab="chat"]').addEventListener("click", loadChatAgents);
</script>
</body>
</html>
