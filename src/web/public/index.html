<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Outreach — Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --border: #e3e6ea;
    --text: #16181d;
    --text-dim: #6b7280;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef0ff;
    --warm: #b45309;
    --warm-soft: #fef3e2;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --success-soft: #ecfdf5;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
    --shadow-md: 0 2px 8px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
    --radius: 10px;
    --sidebar-w: 240px;
    --sans: "Inter", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0c0f; --surface: #16181d; --surface-2: #1b1e24; --border: #2a2d34;
      --text: #eef0f3; --text-dim: #9aa1ac; --accent: #818cf8; --accent-hover: #a5b4fc;
      --accent-soft: #1e1f3d; --warm: #f0a742; --warm-soft: #2e2110;
      --danger: #f87171; --danger-soft: #2c1416; --success-soft: #10231b;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3); --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }

  .shell { display: flex; min-height: 100vh; }

  /* --- Sidebar --- */
  .sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
    padding: 1.4rem 1rem; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0 0.5rem; margin-bottom: 1.6rem; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-hover));
    display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 0.95rem; flex-shrink: 0;
  }
  .brand-name { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }

  .tabs { display: flex; flex-direction: column; gap: 0.15rem; }
  .tab-btn {
    display: flex; align-items: center; gap: 0.6rem; text-align: left;
    background: none; border: none; color: var(--text-dim); font-weight: 500; font-size: 0.88rem;
    padding: 0.55rem 0.7rem; border-radius: 8px; cursor: pointer; transition: background 0.12s, color 0.12s;
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--text); }
  .tab-btn.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .sidebar-footer { margin-top: auto; padding: 0.7rem; font-size: 0.72rem; color: var(--text-dim); }

  /* --- Main --- */
  .main { flex: 1; min-width: 0; padding: 1.6rem 2.2rem 4rem; max-width: 1100px; }

  .topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 1.4rem; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0 0 0.2rem; letter-spacing: -0.01em; }
  .sub { color: var(--text-dim); font-size: 0.88rem; margin: 0; }

  .progress {
    font-size: 0.82rem; color: var(--text-dim); font-weight: 500;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 0.5rem 1rem; box-shadow: var(--shadow-sm); white-space: nowrap;
  }

  .search-row { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  input[type="text"], input[type="email"] {
    flex: 1; padding: 0.6rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.9rem; transition: border-color 0.12s, box-shadow 0.12s;
  }
  input[type="text"]:focus, input[type="email"]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    padding: 0.55rem 1.05rem; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 0.86rem; cursor: pointer;
    transition: background 0.12s, transform 0.05s; box-shadow: var(--shadow-sm);
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  button.secondary:hover:not(:disabled) { background: var(--surface-2); }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.1rem 1.3rem; margin-bottom: 1rem; box-shadow: var(--shadow-sm);
  }
  .card.contacted { opacity: 0.55; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  .card-title { font-weight: 700; font-size: 0.95rem; }
  .channel-link { color: var(--accent); text-decoration: none; margin-left: 0.3rem; font-weight: 400; }
  .channel-link:hover { text-decoration: underline; }
  .card-meta { color: var(--text-dim); font-size: 0.8rem; }
  .card-video { color: var(--text-dim); font-size: 0.84rem; margin: 0.4rem 0 0.7rem; }

  .tag { display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 999px; margin-right: 0.4rem; }
  .tag.found { background: var(--accent-soft); color: var(--accent); }
  .tag.contacted { background: var(--warm-soft); color: var(--warm); }

  .hints { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.7rem; word-break: break-all; }
  .hints a { color: var(--accent); }

  .card-actions-row { display: flex; gap: 0.5rem; margin: 0 0 1rem; flex-wrap: wrap; }
  .review-note { font-size: 0.78rem; color: var(--accent); margin: 0 0 0.5rem; font-style: italic; }
  .email-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .section-title { font-size: 0.95rem; margin: 0 0 0.6rem; font-weight: 700; }
  .saved-row {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.6rem 0.9rem; margin-bottom: 0.5rem; font-size: 0.88rem;
  }
  .draft-box { margin-top: 0.8rem; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1.1rem; }
  .draft-subject { font-weight: 600; margin-bottom: 0.4rem; font-size: 0.92rem; }
  .draft-body { white-space: pre-wrap; font-size: 0.88rem; color: var(--text-dim); margin-bottom: 0.7rem; line-height: 1.5; }
  .draft-subject[contenteditable="true"], .draft-body[contenteditable="true"] {
    outline: 1px dashed var(--accent); border-radius: 4px; padding: 0.2rem 0.4rem; color: var(--text);
  }
  .actions { display: flex; gap: 0.5rem; }
  .remove-btn { background: var(--danger); }
  .remove-btn:hover:not(:disabled) { background: var(--danger); opacity: 0.85; }

  .status-msg { font-size: 0.83rem; margin-top: 0.5rem; font-weight: 500; }
  .status-msg.ok { color: #059669; }
  .status-msg.err { color: var(--danger); }

  .empty { color: var(--text-dim); font-size: 0.88rem; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; margin-bottom: 0.7rem; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-grid label { display: block; font-size: 0.76rem; color: var(--text-dim); font-weight: 600; margin-bottom: 0.3rem; }
  select, textarea {
    width: 100%; padding: 0.6rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 0.9rem; font-family: inherit; transition: border-color 0.12s, box-shadow 0.12s;
  }
  textarea { resize: vertical; min-height: 3.2rem; }

  table.influencers { width: 100%; border-collapse: collapse; font-size: 0.84rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm); }
  table.influencers th, table.influencers td { text-align: left; padding: 0.65rem 0.8rem; border-bottom: 1px solid var(--border); }
  table.influencers th { color: var(--text-dim); font-weight: 600; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.03em; background: var(--surface-2); }
  table.influencers tbody tr:hover { background: var(--surface-2); }
  table.influencers tbody tr:last-child td { border-bottom: none; }
  table.influencers select, table.influencers input { width: auto; padding: 0.3rem 0.4rem; font-size: 0.8rem; }
  .row-actions { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }

  .reply-card { background: var(--warm-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; }
  .reply-snippet { font-size: 0.85rem; color: var(--text-dim); margin: 0.3rem 0 0.6rem; font-style: italic; }
  .reply-form { display: none; margin-top: 0.6rem; }
  .reply-form.open { display: block; }

  .followup-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; box-shadow: var(--shadow-sm); }

  pre.report-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; font-size: 0.84rem; white-space: pre-wrap; box-shadow: var(--shadow-sm); }

  .chat-log { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 0.8rem; max-height: 58vh; overflow-y: auto; padding: 0.4rem; }
  .chat-msg { max-width: 78%; padding: 0.65rem 0.95rem; border-radius: 12px; font-size: 0.87rem; white-space: pre-wrap; line-height: 1.45; }
  .chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .chat-msg.assistant { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 3px; box-shadow: var(--shadow-sm); }
  .chat-input-row { display: flex; gap: 0.5rem; }
  .chat-input-row textarea { flex: 1; min-height: 2.6rem; }
  .chat-note { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 0.8rem; }

  @media (max-width: 780px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; overflow-x: auto; }
    .tabs { flex-direction: row; }
    .sidebar-footer { display: none; }
    .main { padding: 1.2rem 1.1rem 3rem; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div class="brand-name">Outreach</div>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" data-tab="youtube">🔍 Find on YouTube</button>
      <button class="tab-btn" data-tab="manual">✎ Add manually</button>
      <button class="tab-btn" data-tab="influencers">👥 Influencers</button>
      <button class="tab-btn" data-tab="followups">↩ Follow-ups</button>
      <button class="tab-btn" data-tab="chat">💬 Chat with agent</button>
    </nav>
    <div class="sidebar-footer">Local dashboard — 127.0.0.1:4742</div>
  </aside>

  <main class="main">
  <div class="topbar">
    <div>
      <h1>Influencer outreach</h1>
      <p class="sub">Find real candidates, confirm their real email manually, review the draft, then send.</p>
    </div>
    <div class="progress" id="progress">Loading progress…</div>
  </div>

  <div id="tab-youtube" class="tab-panel active">
    <div class="search-row">
      <input type="text" id="niche" placeholder='Niche, e.g. "fitness and gym"' />
      <button id="searchBtn">Search</button>
    </div>

    <div id="savedSection" style="display:none">
      <h2 class="section-title">Saved for later</h2>
      <div id="savedList"></div>
    </div>

    <div id="results"></div>
  </div>

  <div id="tab-manual" class="tab-panel">
    <div class="card">
      <div class="form-grid">
        <div>
          <label for="m-platform">Platform</label>
          <select id="m-platform">
            <option value="tiktok">TikTok</option>
            <option value="instagram">Instagram</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label for="m-name">Creator name/handle</label>
          <input type="text" id="m-name" placeholder="@handle or name" />
        </div>
        <div class="full">
          <label for="m-link">Profile or video link</label>
          <input type="text" id="m-link" placeholder="https://..." />
        </div>
        <div>
          <label for="m-niche">Niche</label>
          <input type="text" id="m-niche" placeholder='e.g. "halal fitness"' />
        </div>
        <div>
          <label for="m-followers">Followers (optional)</label>
          <input type="text" id="m-followers" placeholder="e.g. 120,000" />
        </div>
        <div class="full">
          <label for="m-content">Short description of their recent content (used for personalization)</label>
          <textarea id="m-content" placeholder="What's the video/post about?"></textarea>
        </div>
        <div class="full">
          <label for="m-brands">Brands to offer, comma-separated (optional)</label>
          <input type="text" id="m-brands" placeholder="Brand A, Brand B" />
        </div>
        <div class="full">
          <label for="m-email">Real email</label>
          <input type="email" id="m-email" placeholder="creator@example.com" />
        </div>
      </div>
      <button id="m-draftBtn">Draft</button>
      <div id="m-history" class="hints"></div>
      <div id="m-draftContainer"></div>
    </div>
  </div>

  <div id="tab-influencers" class="tab-panel">
    <div class="card-actions-row">
      <button id="inf-refreshBtn" class="secondary">Refresh</button>
      <button id="inf-checkRepliesBtn">Check for replies</button>
      <button id="inf-reportBtn" class="secondary">View report</button>
      <button id="inf-mdBtn" class="secondary">Regenerate INFLUENCERS.md</button>
      <button id="inf-dashboardBtn" class="secondary">Open live dashboard ↗</button>
    </div>
    <div id="inf-checkRepliesStatus" class="status-msg"></div>
    <div id="inf-replies"></div>
    <div id="inf-reportBox"></div>
    <div id="inf-mdStatus" class="status-msg"></div>
    <div id="inf-table"></div>
  </div>

  <div id="tab-followups" class="tab-panel">
    <div class="card-actions-row">
      <button id="fu-refreshBtn" class="secondary">Refresh</button>
    </div>
    <div id="fu-summary" class="hints"></div>
    <div id="fu-list"></div>
  </div>

  <div id="tab-chat" class="tab-panel">
    <div class="form-grid">
      <div>
        <label for="chat-agent">Agent</label>
        <select id="chat-agent"></select>
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="chat-clearBtn" class="secondary">Clear conversation</button>
      </div>
    </div>
    <p class="chat-note" id="chat-note"></p>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <textarea id="chat-input" placeholder="Type a message…"></textarea>
      <button id="chat-sendBtn">Send</button>
    </div>
  </div>
  </main>
</div>

<script>
const resultsEl = document.getElementById("results");
const searchBtn = document.getElementById("searchBtn");
const nicheInput = document.getElementById("niche");
const progressEl = document.getElementById("progress");

const savedSectionEl = document.getElementById("savedSection");
const savedListEl = document.getElementById("savedList");

function renderSavedList() {
  const saved = JSON.parse(localStorage.getItem("savedCandidates") || "[]");
  if (saved.length === 0) {
    savedSectionEl.style.display = "none";
    return;
  }
  savedSectionEl.style.display = "block";
  savedListEl.innerHTML = "";
  saved.forEach((c) => {
    const row = document.createElement("div");
    row.className = "saved-row";
    row.innerHTML = `
      <span>${c.channelName} <span class="card-meta">(${c.savedNiche})</span></span>
      <button class="secondary remove-saved-btn">Remove</button>
    `;
    row.querySelector(".remove-saved-btn").addEventListener("click", () => {
      const remaining = saved.filter((s) => s.channelId !== c.channelId);
      localStorage.setItem("savedCandidates", JSON.stringify(remaining));
      renderSavedList();
    });
    savedListEl.appendChild(row);
  });
}
renderSavedList();

async function loadProgress() {
  const res = await fetch("/api/progress");
  const p = await res.json();
  progressEl.textContent =
    `Program day ${p.programDay} — ${p.phaseProgress}/${p.phaseTarget} outreaches this phase — ` +
    (p.onTrack ? "on track" : "behind pace");
}
loadProgress();

// Shared by both the YouTube and manual-add flows. Renders a draft with
// Edit/Send/Discard actions into `container`. Editing makes the subject/body
// directly editable in place; sending always re-signs a fresh approval token
// against whatever's currently in those fields right before sending (via
// /api/approve-edit), so an edited draft sends the edited text, not the
// original — and a not-yet-approved draft becomes sendable once the human
// has edited it, same as the CLI's "edit to fix the issue" flow.
function renderDraftBox(container, draft, sendInfo) {
  container.innerHTML = `
    <div class="draft-box">
      ${draft.reviewNote ? `<p class="review-note">${draft.reviewNote}</p>` : ""}
      <div class="draft-subject">${draft.subject}</div>
      <div class="draft-body">${draft.body}</div>
      <div class="actions">
        <button class="secondary edit-btn">Edit</button>
        <button class="send-btn" ${draft.approved ? "" : "disabled"}>Send to ${sendInfo.to}</button>
        <button class="secondary discard-btn">Discard</button>
      </div>
      <div class="status-msg"></div>
    </div>
  `;

  const box = container.querySelector(".draft-box");
  const subjectEl = box.querySelector(".draft-subject");
  const bodyEl = box.querySelector(".draft-body");
  const editBtn = box.querySelector(".edit-btn");
  const sendBtn = box.querySelector(".send-btn");
  const discardBtn = box.querySelector(".discard-btn");
  const statusMsg = box.querySelector(".status-msg");

  if (!draft.approved) {
    statusMsg.textContent = "Not approved by supervisor — edit to fix the issue, then send, or discard and re-draft.";
    statusMsg.className = "status-msg err";
  }

  editBtn.addEventListener("click", () => {
    subjectEl.contentEditable = "true";
    bodyEl.contentEditable = "true";
    subjectEl.focus();
    sendBtn.disabled = false;
    editBtn.disabled = true;
    editBtn.textContent = "Editing…";
    if (!draft.approved) {
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
    }
  });

  sendBtn.addEventListener("click", async () => {
    const subject = subjectEl.textContent.trim();
    const body = bodyEl.textContent.trim();
    sendBtn.disabled = true;
    sendBtn.textContent = "Sending…";
    try {
      const approveRes = await fetch("/api/approve-edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ to: sendInfo.to, subject, body }),
      });
      const approval = await approveRes.json();
      if (approval.error) throw new Error(approval.error);

      const sendRes = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          to: sendInfo.to,
          subject,
          body,
          channelName: sendInfo.channelName,
          niche: sendInfo.niche,
          platform: sendInfo.platform,
          approvalToken: approval.approvalToken,
        }),
      });
      const sendResult = await sendRes.json();
      if (sendResult.error) throw new Error(sendResult.error);
      statusMsg.textContent = "Sent!";
      statusMsg.className = "status-msg ok";
      sendBtn.remove();
      discardBtn.remove();
      editBtn.remove();
      loadProgress();
    } catch (err) {
      statusMsg.textContent = "Failed: " + err.message;
      statusMsg.className = "status-msg err";
      sendBtn.disabled = false;
      sendBtn.textContent = "Retry send";
    }
  });

  discardBtn.addEventListener("click", () => {
    container.innerHTML = "";
  });
}

function candidateCard(c, niche) {
  const div = document.createElement("div");
  div.className = "card" + (c.alreadyContacted ? " contacted" : "");

  const hints = [];
  if (c.contactHints.emails.length) hints.push(`Email(s) found: ${c.contactHints.emails.join(", ")}`);
  if (c.contactHints.links.length) hints.push(`Links: ${c.contactHints.links.slice(0, 3).join(", ")}`);

  const channelUrl = `https://www.youtube.com/channel/${c.channelId}`;
  const aboutUrl = `${channelUrl}/about`;

  div.innerHTML = `
    <div class="card-head">
      <span class="card-title">
        ${c.channelName}
        <a href="${channelUrl}" target="_blank" rel="noopener" class="channel-link" title="Open channel">↗</a>
      </span>
      <span class="card-meta">${c.subscribers.toLocaleString()} subs · ${(c.engagementRate * 100).toFixed(2)}% engagement · ${c.avgViews.toLocaleString()} avg views</span>
    </div>
    <p class="card-video">Latest: "${c.recentVideoTopic}"</p>
    <p class="hints"><a href="${aboutUrl}" target="_blank" rel="noopener">Open About page to find their email →</a></p>
    ${c.alreadyContacted ? `<span class="tag contacted">Already contacted ${c.lastContactedAt ? "on " + new Date(c.lastContactedAt).toLocaleDateString() : ""}</span>` : ""}
    ${hints.length ? `<p class="hints">${hints.join("<br/>")}</p>` : `<p class="hints">No email or links found in public descriptions.</p>`}
    ${!c.alreadyContacted ? `
      <div class="card-actions-row">
        <button class="secondary save-btn">Save for later</button>
        <button class="secondary skip-btn">Skip →</button>
      </div>
      <div class="email-row">
        <input type="email" placeholder="Real email you found manually" class="email-input" />
        <button class="draft-btn">Draft</button>
      </div>
      <div class="draft-container"></div>
    ` : ""}
  `;

  if (!c.alreadyContacted) {
    const emailInput = div.querySelector(".email-input");
    const draftBtn = div.querySelector(".draft-btn");
    const draftContainer = div.querySelector(".draft-container");
    const saveBtn = div.querySelector(".save-btn");
    const skipBtn = div.querySelector(".skip-btn");

        saved.push({ ...c, savedNiche: niche, savedAt: new Date().toISOString() });
        localStorage.setItem("savedCandidates", JSON.stringify(saved));

      saveBtn.disabled = true;

    });

      if (!emailInput.value.trim()) {
        alert("Enter the real email first.");
        return;

      draftBtn.disabled = true;
      draftBtn.textContent = "Drafting…";
      try {
        const res = await fetch("/api/draft", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            channelName: c.channelName,
            niche,
            recentVideoTopic: c.recentVideoTopic,
            to: emailInput.value.trim(),
          }),
        });
        const draft = await res.json();
        if (draft.error) throw new Error(draft.error);

          channelName: c.channelName,
          niche,

        alert("Draft failed: " + err.message);

      }
    });
  }

  return div;
}

const infTable = document.getElementById("inf-table");
const infRefreshBtn = document.getElementById("inf-refreshBtn");

const PLATFORM_LABEL = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", other: "Other" };

async function loadInfluencers() {
  infTable.innerHTML = `<p class="empty">Loading…</p>`;
  try {
    const res = await fetch("/api/influencers");
    const data = await res.json();
    const creators = data.creators || [];
    if (creators.length === 0) {
      infTable.innerHTML = `<p class="empty">No real outreach sent yet.</p>`;
      return;
    }
    infTable.innerHTML = `
      <table class="influencers">
        <thead>
          <tr><th>Creator</th><th>Platform</th><th>Niche</th><th>Status</th><th>Replied</th><th>Times</th><th>Last contacted</th><th>Rate</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    `;
    const tbody = infTable.querySelector("tbody");
    for (const c of creators) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${c.channelName}</td>
        <td>${PLATFORM_LABEL[c.platform] || c.platform}</td>
        <td>${c.niche}</td>
        <td>${c.dealStatus}</td>
        <td>${c.replied ? "yes" : "no"}</td>
        <td>${c.timesContacted}</td>
        <td>${new Date(c.lastContactedAt).toLocaleDateString()}</td>
        <td>
          <select class="rate-select">
            <option value="">-</option>
            <option value="1">1</option><option value="2">2</option><option value="3">3</option>
            <option value="4">4</option><option value="5">5</option>
          </select>
        </td>
        <td class="row-actions">
          <button class="secondary draft-reply-btn">Draft reply</button>
          ${!c.replied ? `<button class="secondary mark-replied-btn">Mark replied</button>` : ""}
          <button class="secondary remove-btn">Remove</button>
        </td>
      `;
      const replyRow = document.createElement("tr");
      const replyCell = document.createElement("td");
      replyCell.colSpan = 9;
      replyRow.appendChild(replyCell);
      replyRow.style.display = "none";

      // Persistent version of the reply/negotiate card (see negotiateCard's
      // comment) — not tied to a single "Check for replies" run, so you can
      // come back and respond to someone whenever, not just the moment a
      // reply was first detected.
      tr.querySelector(".draft-reply-btn").addEventListener("click", () => {
        if (replyCell.childElementCount === 0) {
          replyCell.appendChild(negotiateCard(c.channelId, c.channelName, "", true));
        }
        replyRow.style.display = replyRow.style.display === "none" ? "" : "none";
      });

      // Closes over the real channelId (rather than embedding it in HTML),
      // so anything unusual in it — an email with a "+", etc. — can't break
      // attribute escaping the way string-interpolating it into markup could.
      tr.querySelector(".remove-btn").addEventListener("click", async () => {
        if (!confirm(`Remove ${c.channelName} from the influencers list? This deletes their outreach history.`)) return;
        try {
          const res = await fetch(`/api/influencers/${encodeURIComponent(c.channelId)}`, { method: "DELETE" });
          const result = await res.json();
          if (result.error) throw new Error(result.error);
          tr.remove();
        } catch (err) {
          alert("Remove failed: " + err.message);
        }
      });

      const markRepliedBtn = tr.querySelector(".mark-replied-btn");
      if (markRepliedBtn) {
        markRepliedBtn.addEventListener("click", async () => {
          try {
            await fetch(`/api/mark-replied/${encodeURIComponent(c.channelId)}`, { method: "POST" });
            loadInfluencers();
          } catch (err) {
            alert("Failed: " + err.message);
          }
        });
      }

      tr.querySelector(".rate-select").addEventListener("change", async (e) => {
        const rating = e.target.value;
        if (!rating) return;
        const note = prompt(`Note for this ${rating}/5 rating (optional):`) || undefined;
        try {
          await fetch("/api/rate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ channelId: c.channelId, channelName: c.channelName, rating: Number(rating), note }),
          });
        } catch (err) {
          alert("Rate failed: " + err.message);
        }
      });

      tbody.appendChild(tr);
      tbody.appendChild(replyRow);
    }
  } catch (err) {
    infTable.innerHTML = `<p class="empty">Failed to load: ${err.message}</p>`;
  }
}

// Draft-a-reply / negotiate card. Used two ways: (1) right after "Check for
// replies" detects something new, pre-filled with the snippet and already
// open, and (2) as a persistent "Draft reply" button on any Influencers row
// — a reply only shows up in (1) for the one run that detected it (it won't
// be re-detected once marked replied), so without (2) there'd be no way to
// come back later and actually respond to someone who already replied.
// initialMessage is editable either way, since a persistent open from the
// table has no snippet to start from — you paste in whatever they said.
function negotiateCard(channelId, channelName, initialMessage, autoOpen) {
  const div = document.createElement("div");
  div.className = "reply-card";
  div.innerHTML = `
    <div class="card-title">${channelName}</div>
    <button class="secondary open-reply-btn">Reply / Negotiate</button>
    <div class="reply-form">
      <div class="form-grid">
        <div class="full">
          <label>What did they say? (edit/paste as needed)</label>
          <textarea class="r-message">${initialMessage || ""}</textarea>
        </div>
        <div>
          <label>Their quoted price (optional)</label>
          <input type="text" class="r-price" placeholder="e.g. 500" />
        </div>
        <div>
          <label>Engagement rate, decimal (optional)</label>
          <input type="text" class="r-engagement" placeholder="e.g. 0.04" />
        </div>
        <div class="full">
          <label>Recent video view counts, comma-separated (optional, for CPM baseline)</label>
          <input type="text" class="r-views" placeholder="120000, 95000, 140000" />
        </div>
      </div>
      <button class="r-draftBtn">Draft reply</button>
      <div class="r-draftContainer"></div>
    </div>
  `;

  const openBtn = div.querySelector(".open-reply-btn");
  const form = div.querySelector(".reply-form");
  if (autoOpen) form.classList.add("open");
  openBtn.addEventListener("click", () => {
    form.classList.toggle("open");
  });

  // No message handed in up front (the persistent per-row "Draft reply"
  // case, as opposed to right after "Check for replies" detects one) — pull
  // their actual latest reply straight from Gmail instead of making the
  // human paste it in by hand. It's already been read once via
  // check-replies; there's no reason to ask again.
  if (!initialMessage) {
    const messageEl = div.querySelector(".r-message");
    messageEl.placeholder = "Loading their message from Gmail…";
    messageEl.disabled = true;
    fetch(`/api/negotiate/last-message/${encodeURIComponent(channelId)}`)
      .then((r) => r.json())
      .then((data) => {
        if (data.error) throw new Error(data.error);
        messageEl.value = data.message?.body ?? "";
        messageEl.placeholder = data.message ? "" : "Couldn't auto-fetch a reply — paste it in manually.";
      })
      .catch((err) => {
        messageEl.placeholder = "Couldn't auto-fetch (" + err.message + ") — paste it in manually.";
      })
      .finally(() => {
        messageEl.disabled = false;
      });
  }

  div.querySelector(".r-draftBtn").addEventListener("click", async () => {
    const draftBtn = div.querySelector(".r-draftBtn");
    const draftContainer = div.querySelector(".r-draftContainer");
    const creatorMessage = div.querySelector(".r-message").value.trim();
    const priceRaw = div.querySelector(".r-price").value.trim();
    const engagementRaw = div.querySelector(".r-engagement").value.trim();
    const viewsRaw = div.querySelector(".r-views").value.trim();
    const viewCounts = viewsRaw ? viewsRaw.split(",").map((s) => Number(s.trim())).filter((n) => !Number.isNaN(n)) : [];

    if (!creatorMessage) {
      alert("Enter what they said first.");
      return;
    }

    draftBtn.disabled = true;
    draftBtn.textContent = "Drafting…";
    try {
      const contextRes = await fetch(`/api/negotiate/context/${encodeURIComponent(channelId)}`);
      const context = await contextRes.json();
      const to = context.lastSend?.to;
      if (!to) throw new Error("No prior send on file for this channel — can't determine recipient.");

      const res = await fetch("/api/negotiate/draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          channelId,
          channelName,
          niche: context.lastSend?.niche,
          creatorMessage,
          quotedPrice: priceRaw || undefined,
          engagementRate: engagementRaw || undefined,
          viewCounts,
        }),
      });
      const draft = await res.json();
      if (draft.error) throw new Error(draft.error);

      draftContainer.innerHTML = `
        <div class="draft-box">
          ${draft.reviewNote ? `<p class="review-note">${draft.reviewNote}</p>` : ""}
          ${draft.roundWarning ? `<p class="review-note">${draft.roundWarning}</p>` : ""}
          <p class="card-meta">Recommended action: ${draft.action}${draft.evaluation ? ` — CPM verdict: ${draft.evaluation.verdict}` : ""}</p>
          <div class="draft-body">${draft.body}</div>
          <div class="actions">
            <button class="secondary r-editBtn">Edit</button>
            <button class="r-sendBtn" ${draft.approved ? "" : "disabled"}>Send to ${to}</button>
            <button class="secondary r-discardBtn">Discard</button>
          </div>
          <div class="status-msg"></div>
        </div>
      `;

      const bodyEl = draftContainer.querySelector(".draft-body");
      const editBtn = draftContainer.querySelector(".r-editBtn");
      const sendBtn = draftContainer.querySelector(".r-sendBtn");
      const discardBtn = draftContainer.querySelector(".r-discardBtn");
      const statusMsg = draftContainer.querySelector(".status-msg");

      if (!draft.approved) {
        statusMsg.textContent = "Not approved by supervisor — edit to fix the issue, then send.";
        statusMsg.className = "status-msg err";
      }

      editBtn.addEventListener("click", () => {
        bodyEl.contentEditable = "true";
        bodyEl.focus();
        sendBtn.disabled = false;
        editBtn.disabled = true;
        editBtn.textContent = "Editing…";
      });

      sendBtn.addEventListener("click", async () => {
        sendBtn.disabled = true;
        sendBtn.textContent = "Sending…";
        try {
          const sendRes = await fetch("/api/negotiate/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              channelId,
              channelName,
              niche: context.lastSend?.niche,
              to,
              body: bodyEl.textContent.trim(),
              quotedPrice: priceRaw || undefined,
              action: draft.action,
              gmailThreadId: context.lastSend?.gmailThreadId,
              rfcMessageId: context.lastSend?.rfcMessageId,
            }),
          });
          const sendResult = await sendRes.json();
          if (sendResult.error) throw new Error(sendResult.error);
          statusMsg.textContent = `Sent! Deal status: ${sendResult.dealStatus ?? "n/a"}.`;
          statusMsg.className = "status-msg ok";
          sendBtn.remove();
          discardBtn.remove();
          editBtn.remove();
          loadInfluencers();
        } catch (err) {
          statusMsg.textContent = "Failed: " + err.message;
          statusMsg.className = "status-msg err";
          sendBtn.disabled = false;
          sendBtn.textContent = "Retry send";
        }
      });

      discardBtn.addEventListener("click", () => {
        draftContainer.innerHTML = "";
      });
    } catch (err) {
      alert("Draft failed: " + err.message);
    } finally {
      draftBtn.disabled = false;
      draftBtn.textContent = "Draft reply";
    }
  });

  return div;
}

    const res = await fetch("/api/followups");
    const data = await res.json();
    fuSummary.textContent = `Due now: ${data.due.length} | Not yet due: ${data.notYetDue.length} | Needs new thread (max follow-ups reached): ${data.needsNewThread.length}`;
    fuList.innerHTML = "";
    if (data.due.length === 0) {
      fuList.innerHTML = `<p class="empty">Nothing due right now.</p>`;
      return;
    }
    for (const c of data.due) {
      if (!c.gmailThreadId || !c.rfcMessageId) continue; // sent before threading existed — CLI-only fallback
      fuList.appendChild(followupCard(c));
    }
  } catch (err) {
    fuList.innerHTML = `<p class="empty">Failed to load: ${err.message}</p>`;
  }
}
fuRefreshBtn.addEventListener("click", loadFollowups);

// --- Chat with agent -------------------------------------------------------
const chatAgentSelect = document.getElementById("chat-agent");
const chatNote = document.getElementById("chat-note");
const chatLog = document.getElementById("chat-log");
const chatInput = document.getElementById("chat-input");
const chatSendBtn = document.getElementById("chat-sendBtn");
const chatClearBtn = document.getElementById("chat-clearBtn");

// Keyed by agent id so switching agents (or tabs) doesn't lose each
// conversation's history — history lives only in this tab, not on the server.
const chatHistories = {};
let chatAgentsLoaded = false;

async function loadChatAgents() {
  if (chatAgentsLoaded) return;
  chatAgentsLoaded = true;
  try {
    const res = await fetch("/api/chat/agents");
    const data = await res.json();
    chatAgentSelect.innerHTML = data.agents
      .map((a) => `<option value="${a.id}" data-note="${(a.note || "").replace(/"/g, "&quot;")}">${a.label}</option>`)
      .join("");
    updateChatNote();
    renderChatLog();
  } catch (err) {
    chatNote.textContent = "Failed to load agent list: " + err.message;
  }
}

function updateChatNote() {
  chatNote.textContent = chatAgentSelect.selectedOptions[0]?.dataset.note ?? "";
}

chatAgentSelect.addEventListener("change", () => {
  updateChatNote();
  renderChatLog();
});

function currentHistory() {
  const id = chatAgentSelect.value;
  if (!chatHistories[id]) chatHistories[id] = [];
  return chatHistories[id];
}

function renderChatLog() {
  const history = currentHistory();
  chatLog.innerHTML = "";
  for (const msg of history) {
    const div = document.createElement("div");
    div.className = "chat-msg " + msg.role;
    div.textContent = msg.content;
    chatLog.appendChild(div);
  }
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  const agentId = chatAgentSelect.value;
  const history = currentHistory();
  history.push({ role: "user", content: text });
  chatInput.value = "";
  renderChatLog();

  chatSendBtn.disabled = true;
  chatSendBtn.textContent = "…";
  try {
    const res = await fetch(`/api/chat/${encodeURIComponent(agentId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    history.push({ role: "assistant", content: data.reply });
    renderChatLog();
  } catch (err) {
    history.push({ role: "assistant", content: "(error: " + err.message + ")" });
    renderChatLog();
  } finally {
    chatSendBtn.disabled = false;
    chatSendBtn.textContent = "Send";
  }
}

chatSendBtn.addEventListener("click", sendChatMessage);
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
chatClearBtn.addEventListener("click", () => {
  chatHistories[chatAgentSelect.value] = [];
  renderChatLog();
});

document.querySelector('.tab-btn[data-tab="chat"]').addEventListener("click", loadChatAgents);
</script>
